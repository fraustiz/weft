# Shared by the two /stats locations in nginx.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host umami.jules-drevon.fr;
proxy_ssl_server_name on;
proxy_ssl_name umami.jules-drevon.fr;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
# Umami geolocates and deduplicates visitors from these headers. Cloudflare
# sets CF-Connecting-IP (and overwrites any value a visitor sends).
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The landing sets no cookie; never forward one to Umami.
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;
# Keep this site's own security headers rather than Umami's.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
