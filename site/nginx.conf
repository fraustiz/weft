server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    # Umami's host is resolved at request time (through a variable), so a DNS
    # hiccup at container start cannot keep the landing from booting. The
    # entrypoint fills NGINX_LOCAL_RESOLVERS from /etc/resolv.conf.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
    set $umami https://umami.jules-drevon.fr;

    # Pages: always revalidated. French at /, English at /en/.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
    location = /en { return 301 /en/; }

    # robots.txt goes through / (text/plain); the sitemap is served as application/xml.
    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { application/xml xml; }
    }

    # CSS and JS carry a content hash in their URL (added at build), so they can be cached long.
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Visitor counting with self-hosted Umami. The tracker and its collection
    # endpoint are served from this origin, so the CSP stays 'self'. Only these
    # two exact paths are forwarded: Umami's login, dashboard and the rest of
    # its API are never reachable through this host.
    location = /stats/script.js {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $umami/script.js;
        include /etc/nginx/snippets/umami-proxy.conf;
    }
    location = /stats/api/send {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 16k;
        proxy_pass $umami/api/send;
        include /etc/nginx/snippets/umami-proxy.conf;
    }
}
