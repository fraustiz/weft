name: App release

# Pushing a tag app-vX.Y.Z builds the macOS, Android, Windows and iOS apps at
# version X.Y.Z, and publishes them as the GitHub release of that tag:
#
#   Weft-X.Y.Z-mac.dmg         the app in a disk image with an Applications
#                              link: what people download
#   Weft-X.Y.Z-mac.zip         the same app zipped with ditto: the appcast's
#                              enclosure, what Sparkle downloads for updates
#   appcast.xml                Sparkle's feed: the app checks
#                              releases/latest/download/appcast.xml
#   weft-X.Y.Z.apk             the Android app, signed with the release key
#   android-update.json        what the Android app checks:
#                              releases/latest/download/android-update.json
#   weft-X.Y.Z-windows.exe     the Windows app
#   windows-update.json        what the Windows app checks:
#                              releases/latest/download/windows-update.json
#   Weft-X.Y.Z-ios.ipa         the iOS app, ad hoc signed, for testers to
#                              sideload with their own Apple ID (no updates)
#
# and, once the Apple secrets below are set, it uploads the iOS app to App
# Store Connect for TestFlight (job testflight).
#
# Run by hand (workflow_dispatch), it builds and checks everything, signs
# with the same secrets, and keeps the files as workflow artifacts: nothing
# is published.
#
# Secrets: SPARKLE_ED_PRIVATE_KEY (the EdDSA private key whose public half
# is macos/sparkle-public-key.txt), ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
#
# Apple (team FTXAB58KDV, an individual Apple Developer Program account).
# Each part turns on when its secrets are set, and is skipped with a warning
# otherwise:
#   APPLE_DEVELOPER_ID_CERT_P12, APPLE_DEVELOPER_ID_CERT_PASSWORD
#       the "Developer ID Application" certificate and its private key
#       (.p12, base64): the Mac app is signed with it, hardened runtime,
#       then notarized and stapled, the disk image too. Without it the app
#       is signed ad hoc, as before.
#   APPLE_DISTRIBUTION_CERT_P12, APPLE_DISTRIBUTION_CERT_PASSWORD
#       the "Apple Distribution" certificate (.p12, base64): the iOS app is
#       archived with it; tag pushes upload it to App Store Connect, dry
#       runs only export it.
#   APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_API_KEY_ID,
#   APP_STORE_CONNECT_API_ISSUER_ID
#       an App Store Connect API key with the Admin role (the text of the
#       .p8 file, its key ID, the issuer ID): notarization, provisioning
#       profiles (xcodebuild -allowProvisioningUpdates) and the upload.
#
# Windows code signing (SignPath Foundation, see CODE_SIGNING_POLICY.md) is
# off until the repository variable SIGNPATH_ORGANIZATION_ID is set. Then,
# on tag pushes only, the windows job uploads the unsigned executable,
# submits it to SignPath, waits for a maintainer to approve the request
# there, and publishes the signed executable (its SHA-256 goes in
# windows-update.json). Dry runs never submit a signing request.
#   variables: SIGNPATH_ORGANIZATION_ID (turns signing on),
#              SIGNPATH_PROJECT_SLUG (default "weft"),
#              SIGNPATH_SIGNING_POLICY_SLUG (default "release-signing"),
#              SIGNPATH_ARTIFACT_CONFIGURATION_SLUG (default: the project's
#              default artifact configuration)
#   secret:    SIGNPATH_API_TOKEN (a SignPath CI user's API token)

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, X.Y.Z (dry run: nothing is published)"
        required: true
        default: "0.0.0"

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == push ]]; then
            version="${REF_NAME#app-v}"
            publish=true
          else
            version="$INPUT_VERSION"
            publish=false
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version must be X.Y.Z, not '$version'"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=app-v$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "Weft $version (publish: $publish)"

  mac:
    needs: meta
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      APPLE_TEAM_ID: FTXAB58KDV
    steps:
      - uses: actions/checkout@v7
        with:
          # CFBundleVersion is the number of commits.
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CMake
        # For mediaremote-adapter; usually already on the runner.
        run: command -v cmake || brew install cmake
      - name: Signing paths
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >>"$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"
      - name: Developer ID certificate
        id: devid
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::APPLE_DEVELOPER_ID_CERT_P12 is not set: the Mac app is signed ad hoc and not notarized"
            echo "signed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$API_KEY" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "::error::notarizing needs APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_API_ISSUER_ID"
            exit 1
          fi
          identity="$(KIND="Developer ID Application" TEAM_ID="$APPLE_TEAM_ID" .github/scripts/import-certificate.sh)"
          (umask 077; printf '%s\n' "$API_KEY" >"$NOTARY_KEY_PATH")
          echo "identity=$identity" >>"$GITHUB_OUTPUT"
          echo "signed=true" >>"$GITHUB_OUTPUT"
          echo "Developer ID identity $identity"
      - name: Build Weft.app
        env:
          WEFT_VERSION: ${{ env.VERSION }}
          # Empty: ad hoc.
          WEFT_SIGN_IDENTITY: ${{ steps.devid.outputs.identity }}
        run: macos/scripts/build-app.sh
      - name: Check Weft.app
        env:
          SIGNED: ${{ steps.devid.outputs.signed }}
        run: |
          app=macos/build/Weft.app
          plist="$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          [[ "$(lipo -archs "$app/Contents/MacOS/Weft")" == *arm64* && "$(lipo -archs "$app/Contents/MacOS/Weft")" == *x86_64* ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist")" == https://github.com/fraustiz/weft/releases/latest/download/appcast.xml ]]
          [[ -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")" ]]
          echo "build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          if [[ "$SIGNED" == true ]]; then
            # Not codesign -dv's whole output: it names the developer.
            details="$(codesign -dv "$app" 2>&1)"
            grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<<"$details" || { echo "::error::Weft.app is not signed by team $APPLE_TEAM_ID"; exit 1; }
            grep -q '^CodeDirectory .*flags=.*(runtime)' <<<"$details" || { echo "::error::Weft.app lacks the hardened runtime"; exit 1; }
            grep -q '^Timestamp=' <<<"$details" || { echo "::error::Weft.app has no secure timestamp"; exit 1; }
          fi
      - name: Notarize Weft.app
        if: steps.devid.outputs.signed == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          app=macos/build/Weft.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Weft-notarize.zip"
          macos/scripts/notarize.sh "$RUNNER_TEMP/Weft-notarize.zip"
          rm -f "$RUNNER_TEMP/Weft-notarize.zip"
          # The ticket goes in the app, so the zip Sparkle downloads and the
          # disk image both carry it.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent macos/build/Weft.app "dist/Weft-$VERSION-mac.zip"
      - name: Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || { echo "::error::the SPARKLE_ED_PRIVATE_KEY secret is not set"; exit 1; }
          # The private key must be the half of the app's public key, or
          # every installed copy would refuse the update.
          app_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' macos/build/Weft.app/Contents/Info.plist)"
          secret_key="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | swift -e 'import CryptoKit
          import Foundation
          let seed = Data(base64Encoded: readLine()!.trimmingCharacters(in: .whitespaces))!
          print(try! Curve25519.Signing.PrivateKey(rawRepresentation: seed.prefix(32)).publicKey.rawRepresentation.base64EncodedString())')"
          if [[ "$secret_key" != "$app_key" ]]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY does not match macos/sparkle-public-key.txt"
            exit 1
          fi
          # generate_appcast reads the versions, minimumSystemVersion
          # (LSMinimumSystemVersion) and key from the app in the zip; the
          # private key goes in on stdin, never in a file or the log.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/fraustiz/weft/releases/download/$TAG/" \
            -o dist/appcast.xml dist 2>&1 | tee "$RUNNER_TEMP/appcast.log"
          if grep -qi 'does not match' "$RUNNER_TEMP/appcast.log"; then exit 1; fi
          url="https://github.com/fraustiz/weft/releases/download/$TAG/Weft-$VERSION-mac.zip"
          grep -qF "url=\"$url\"" dist/appcast.xml || { echo "::error::no enclosure $url in the appcast"; exit 1; }
          grep -q 'sparkle:edSignature="' dist/appcast.xml
          grep -q '<sparkle:minimumSystemVersion>' dist/appcast.xml
          grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" dist/appcast.xml
          cat dist/appcast.xml
      - name: Disk image
        # After the appcast: generate_appcast scans dist/, and a .dmg there
        # would get an item of its own. Sparkle keeps updating from the zip.
        env:
          SIGNED: ${{ steps.devid.outputs.signed }}
          IDENTITY: ${{ steps.devid.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          items="$(grep -o '<item>' dist/appcast.xml | wc -l | tr -d ' ')"
          [[ "$items" == 1 ]] || { echo "::error::the appcast has $items items, expected 1"; exit 1; }
          url="https://github.com/fraustiz/weft/releases/download/$TAG/Weft-$VERSION-mac.zip"
          if [[ "$(grep -o '<enclosure ' dist/appcast.xml | wc -l | tr -d ' ')" != 1 ]] || ! grep -qF "url=\"$url\"" dist/appcast.xml; then
            echo "::error::the appcast's only enclosure should be $url"
            exit 1
          fi
          dmg="dist/Weft-$VERSION-mac.dmg"
          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging" && mkdir -p "$staging"
          # ditto keeps the signature, the stapled ticket, extended
          # attributes and symlinks.
          ditto macos/build/Weft.app "$staging/Weft.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Weft" -srcfolder "$staging" -ov -format UDZO "$dmg"
          if [[ "$SIGNED" == true ]]; then
            codesign --sign "$IDENTITY" --timestamp "$dmg"
            macos/scripts/notarize.sh "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature "$dmg"
          fi
          hdiutil verify "$dmg"
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          trap 'hdiutil detach "$mnt" -quiet || hdiutil detach "$mnt" -force' EXIT
          codesign --verify --deep --strict "$mnt/Weft.app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mnt/Weft.app/Contents/Info.plist")" == "$VERSION" ]]
          [[ "$(readlink "$mnt/Applications")" == /Applications ]]
          ls -l "$dmg"
      - name: Remove the signing keychain and the API key
        if: always()
        run: |
          if [[ -f "$KEYCHAIN" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$KEYCHAIN.password" "$NOTARY_KEY_PATH"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/Weft-${{ env.VERSION }}-mac.dmg
            dist/Weft-${{ env.VERSION }}-mac.zip
            dist/appcast.xml
          if-no-files-found: error

  android:
    needs: meta
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the number of commits.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "::error::the ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.keystore")
      - name: Build the release APK
        working-directory: android
        env:
          WEFT_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          WEFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WEFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WEFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export WEFT_VERSION_NAME="$VERSION"
          WEFT_VERSION_CODE="$(git rev-list --count HEAD)"
          export WEFT_VERSION_CODE
          echo "versionName $WEFT_VERSION_NAME, versionCode $WEFT_VERSION_CODE"
          ./gradlew --no-daemon :app:assembleRelease
      - name: APK and android-update.json
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          [[ -f "$apk" ]] || { echo "::error::no signed APK at $apk"; ls android/app/build/outputs/apk/release; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk"
          mkdir -p dist
          cp "$apk" "dist/weft-$VERSION.apk"
          sha256="$(sha256sum "dist/weft-$VERSION.apk" | cut -d' ' -f1)"
          jq -n \
            --argjson versionCode "$(git rev-list --count HEAD)" \
            --arg versionName "$VERSION" \
            --arg url "https://github.com/fraustiz/weft/releases/download/$TAG/weft-$VERSION.apk" \
            --arg sha256 "$sha256" \
            '{versionCode: $versionCode, versionName: $versionName, url: $url, sha256: $sha256}' \
            >dist/android-update.json
          cat dist/android-update.json
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/weft-${{ env.VERSION }}.apk
            dist/android-update.json
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    permissions:
      contents: read
      # SignPath reads the unsigned artifact and the run's details with the
      # job's token.
      actions: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the number of commits.
          fetch-depth: 0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Build weft-windows.exe
        shell: bash
        run: |
          export WEFT_VERSION="$VERSION"
          WEFT_VERSION_CODE="$(git rev-list --count HEAD)"
          export WEFT_VERSION_CODE
          echo "versionName $WEFT_VERSION, versionCode $WEFT_VERSION_CODE"
          cargo build --manifest-path windows/Cargo.toml --release --locked
      # Code signing: tag pushes only, once SignPath has accepted the project
      # (see the header). Every request waits for a manual approval.
      - name: Upload the unsigned executable
        id: unsigned
        if: needs.meta.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: windows/target/release/weft-windows.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'weft' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A person approves the request in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed
      - name: Use the signed executable
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed/weft-windows.exe'
          if (-not (Test-Path -PathType Leaf $signed)) {
            Write-Output "::error::no signed executable at $signed"
            Get-ChildItem -Recurse (Join-Path $env:RUNNER_TEMP 'signed')
            exit 1
          }
          Copy-Item -Force $signed windows/target/release/weft-windows.exe
          # Fails unless the Authenticode signature is valid.
          $signature = Get-AuthenticodeSignature windows/target/release/weft-windows.exe
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if ($signature.Status -ne 'Valid') { exit 1 }
      - name: Executable and windows-update.json
        shell: bash
        run: |
          exe=windows/target/release/weft-windows.exe
          [[ -f "$exe" ]] || { echo "::error::no executable at $exe"; exit 1; }
          mkdir -p dist
          cp "$exe" "dist/weft-$VERSION-windows.exe"
          sha256="$(sha256sum "dist/weft-$VERSION-windows.exe" | cut -d' ' -f1 | tr -d '\r')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::unexpected sha256 '$sha256'"; exit 1; }
          jq -n \
            --argjson versionCode "$(git rev-list --count HEAD)" \
            --arg versionName "$VERSION" \
            --arg url "https://github.com/fraustiz/weft/releases/download/$TAG/weft-$VERSION-windows.exe" \
            --arg sha256 "$sha256" \
            '{versionCode: $versionCode, versionName: $versionName, url: $url, sha256: $sha256}' \
            >dist/windows-update.json
          cat dist/windows-update.json
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/weft-${{ env.VERSION }}-windows.exe
            dist/windows-update.json
          if-no-files-found: error

  ios:
    needs: meta
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # CFBundleVersion is the number of commits.
          fetch-depth: 0
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build Weft.app for iPhone, unsigned
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project Weft.xcodeproj -scheme Weft -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      # For testers outside TestFlight: they sideload the .ipa with their
      # own Apple ID (SideStore, AltStore), which re-signs it. The ad hoc
      # signature only carries the entitlements, so the App Group of the
      # share extension is registered when they re-sign it.
      - name: Version, ad hoc signature and .ipa
        working-directory: ios
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/Weft.app
          build="$(git rev-list --count HEAD)"
          for plist in "$app/Info.plist" "$app/PlugIns/WeftShare.appex/Info.plist"; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
          done
          codesign -f -s - --entitlements Config/Shared.entitlements "$app/PlugIns/WeftShare.appex"
          codesign -f -s - --entitlements Config/Shared.entitlements "$app"
          codesign -d --entitlements - --xml "$app" | grep -q group.eu.frohub.weft
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../dist
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/Weft-$VERSION-ios.ipa" Payload)
          unzip -l "../dist/Weft-$VERSION-ios.ipa" | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/Weft-${{ env.VERSION }}-ios.ipa
          if-no-files-found: error

  testflight:
    needs: meta
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      APPLE_TEAM_ID: FTXAB58KDV
      API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # CFBundleVersion is the number of commits.
          fetch-depth: 0
      - name: Signing paths
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >>"$GITHUB_ENV"
          echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"
      - name: Distribution certificate and API key
        id: signing
        env:
          P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::warning::APPLE_DISTRIBUTION_CERT_P12 is not set: no TestFlight build"
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$API_KEY" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
            echo "::error::TestFlight needs APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_API_ISSUER_ID"
            exit 1
          fi
          identity="$(KIND="Apple Distribution" TEAM_ID="$APPLE_TEAM_ID" .github/scripts/import-certificate.sh)"
          (umask 077; printf '%s\n' "$API_KEY" >"$API_KEY_PATH")
          echo "Apple Distribution identity $identity"
          echo "enabled=true" >>"$GITHUB_OUTPUT"
      - name: Install XcodeGen
        if: steps.signing.outputs.enabled == 'true'
        run: command -v xcodegen || brew install xcodegen
      - name: Archive Weft for the App Store
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          build="$(git rev-list --count HEAD)"
          echo "Weft $VERSION ($build)"
          # Automatic signing with the Apple Distribution identity; the API
          # key lets xcodebuild fetch or create the App Store provisioning
          # profiles of the app and of its share extension.
          xcodebuild -project Weft.xcodeproj -scheme Weft -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -archivePath build/Weft.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive
          app=build/Weft.xcarchive/Products/Applications/Weft.app
          for plist in "$app/Info.plist" "$app/PlugIns/WeftShare.appex/Info.plist"; do
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$VERSION" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$build" ]]
          done
          codesign -d --entitlements - --xml "$app" | grep -q group.eu.frohub.weft
          codesign -d --entitlements - --xml "$app/PlugIns/WeftShare.appex" | grep -q group.eu.frohub.weft
      - name: Upload to App Store Connect (tag pushes) or export (dry runs)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          if [[ "$PUBLISH" == true ]]; then destination="upload"; else destination="export"; fi
          cat >build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          plutil -lint build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Weft.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          ls -l build/export
      - name: Remove the signing keychain and the API key
        if: always()
        run: |
          if [[ -f "$KEYCHAIN" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$KEYCHAIN.password" "$API_KEY_PATH"

  release:
    needs: [meta, mac, android, windows, ios]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # --latest: the apps look for releases/latest/download/…
          # --notes goes before the generated changelog; SignPath asks release
          # pages to link the code signing policy.
          policy="https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CODE_SIGNING_POLICY.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Weft $VERSION" \
            --notes "Code signing policy: [CODE_SIGNING_POLICY.md]($policy)" \
            --generate-notes \
            --latest \
            "dist/Weft-$VERSION-mac.dmg" \
            "dist/Weft-$VERSION-mac.zip" \
            dist/appcast.xml \
            "dist/weft-$VERSION.apk" \
            dist/android-update.json \
            "dist/weft-$VERSION-windows.exe" \
            dist/windows-update.json \
            "dist/Weft-$VERSION-ios.ipa"
