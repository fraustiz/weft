name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "crates/weft-protocol/vectors/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "crates/weft-protocol/vectors/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and debug builds (every distribution flavor)
        working-directory: android
        run: bash gradlew --no-daemon :protocol:testDebugUnitTest :app:testGithubDebugUnitTest :app:testFdroidDebugUnitTest :app:testPlayDebugUnitTest :app:assembleGithubDebug :app:assembleFdroidDebug :app:assemblePlayDebug
      - name: Clean build outputs
        if: always()
        run: rm -rf android/app/build android/protocol/build android/.gradle
