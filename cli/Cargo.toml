[package]
name = "weft-cli"
version = "0.1.0"
description = "Weft command-line client: pairs with other devices and exchanges clipboard text through the relay"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.12"
weft-protocol = { path = "../crates/weft-protocol" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "io-util"] }
weft-relay = { path = "../relay" }
