name: Weft
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  WeftMobile:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: FTXAB58KDV
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
targets:
  Weft:
    type: application
    platform: iOS
    sources: [Sources/WeftiOS, Resources/Assets.xcassets, Resources/PrivacyInfo.xcprivacy]
    dependencies:
      - package: WeftMobile
        product: WeftMobileKit
      - target: WeftShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.frohub.weft.ios
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WeftShare:
    type: app-extension
    platform: iOS
    sources: [Sources/WeftShare, Resources/PrivacyInfo.xcprivacy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.frohub.weft.ios.share
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Weft:
    build:
      targets:
        Weft: all
