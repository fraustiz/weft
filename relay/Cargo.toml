[package]
name = "weft-relay"
version = "0.1.0"
description = "Weft relay: authenticates devices and forwards end-to-end encrypted envelopes"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
getrandom = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
weft-protocol = { path = "../crates/weft-protocol" }

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
