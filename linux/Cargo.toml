[package]
name = "weft-linux"
version = "0.1.0"
description = "Weft for Linux: desktop daemon and control CLI for sharing clipboard, files, notifications, media, and input across your devices"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "weft-desktop"
path = "src/main.rs"

# Standalone workspace with its own lock file so the relay and other platforms
# never build Linux desktop dependencies.
[workspace]
resolver = "2"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.12"
weft-cli = { path = "../cli" }
weft-client = { path = "../crates/weft-client" }
weft-protocol = { path = "../crates/weft-protocol" }

[dev-dependencies]
tempfile = "3.27.0"
weft-relay = { path = "../relay" }
